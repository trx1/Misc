  <style>
   
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Print Setup for 8.5" x 11" / 8.5" x 11.5" standard paper */
    @page {
      size: 8.5in 11in;
      margin: 0.25in;
    }

    @media print {
      .no-print {
        display: none !important;
      }

      body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .page-container {
        box-shadow: none !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }
    }

    /* 
      Responsive Hexagon Grid Technique 
      Reference: https://css-tricks.com/responsive-hexagon-grid-using-modern-css/
    */
    :root {
      --s: 38px;
      /* Hexagon size (width) */
      --g: 3px;
      /* Gap between hexagons */
    }

    /* .hex-container {
      display: flex;
      flex-wrap: wrap;
      gap: var(--g);
      justify-content: center;
      padding-bottom: calc(var(--s) / (4 * 0.866025));
      margin: 0 auto;
    } */

    .hex-cell {
      position: relative;
      width: var(--s);
      aspect-ratio: 0.866025;
      /* cos(30deg) ratio */
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      user-select: none;
      clip-path: polygon(-50% 50%, 50% 100%, 150% 50%, 50% 0);
      margin-bottom: calc(var(--s) / -3.4641);
      /* Overlap vertical rows */
      transition: transform 0.15s ease, z-index 0.15s ease, filter 0.15s ease;
      cursor: pointer;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      filter: drop-shadow(0px 0px 0.75px rgba(0, 0, 0, 0.75));
    }

    /* Shift every alternate row for true honeycomb interlocking */
    .hex-row-shift {
      margin-left: calc((var(--s) + var(--g)) / 2);
    }

    .hex-cell:hover {
      transform: scale(1.35);
      z-index: 100;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.4));
    }

    .hex-code {
      font-size: 8.5px;
      font-weight: 900;
      font-family: 'Inter', sans-serif;
      line-height: 1;
      letter-spacing: -0.03em;
      pointer-events: none;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Print scaling optimization for 8.5" x 11.5" */
    @media print {
      :root {
        --s: 34px;
        --g: 2px;
      }

      .hex-code {
        font-size: 7.5px !important;
      }

      .hex-cell {
        filter: drop-shadow(0px 0px 0.5px rgba(0, 0, 0, 0.6)) !important;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      :root {
        --s: 32px;
        --g: 2px;
      }

      .hex-code {
        font-size: 7px;
      }

      .hex-cell {
        filter: drop-shadow(0px 0px 0.5px rgba(0, 0, 0, 0.6)) !important;
      }
    }

    /* Outline mode when colors are turned off */
    body.no-color .hex-cell {
      background-color: #ffffff !important;
      outline: 1.5px solid #111827 !important;
      outline-offset: -1.5px;
    }

    body.no-color .hex-code {
      color: #111827 !important;
    }

    .container {


      display: flex;
      gap: var(--g);
      flex-wrap: wrap;
      padding-bottom: calc(var(--s)/(4*cos(30deg)));
      container-type: inline-size;
    }

    .container>* {
      width: var(--s);
      aspect-ratio: cos(30deg);
      border-radius: 50% / 25%;
      corner-shape: bevel;
      margin-bottom: calc(var(--s)/(-4*cos(30deg)));
      --_n: round(down, (100cqw + var(--g))/(var(--s) + var(--g)));
      --_m: round(down, (100cqw - (var(--s) - var(--g))/2)/(var(--s) + var(--g)));
      --_c: round(down, 1 - mod((sibling-index() - 1 + var(--_m))/(var(--_n) + var(--_m)), 1));
      margin-left: calc(var(--_c)*(var(--s) + var(--g))/2);
    }
  </style>
</head>

      {code: "W-8", color: "#47443D"}, {code: "W-9", color: "#312F2A"}, {code: "W-10", color: "#1D1C19"},

      // Y Family
      {code: "Y0000", color: "#FEFDEB"}, {code: "Y000", color: "#FFFDD8"}, {code: "Y00", color: "#FFFBB9"},
      {code: "Y02", color: "#FFF785"}, {code: "Y04", color: "#FFF35B"}, {code: "Y06", color: "#FFF000"},
      {code: "Y08", color: "#FEEB00"}, {code: "Y11", color: "#FFF9C6"}, {code: "Y13", color: "#FFF59D"},
      {code: "Y15", color: "#FFE853"}, {code: "Y17", color: "#FFDF00"}, {code: "Y18", color: "#FFD900"},
      {code: "Y19", color: "#FFD000"}, {code: "Y21", color: "#FEEBB3"}, {code: "Y23", color: "#F5DC94"},
      {code: "Y26", color: "#C6AF48"}, {code: "Y28", color: "#A79140"}, {code: "Y32", color: "#FCD999"},
      {code: "Y35", color: "#FFB948"}, {code: "Y38", color: "#FFA827"},

      // YG Family
      {code: "YG0000", color: "#F6FAF0"}, {code: "YG00", color: "#EAF5D8"}, {code: "YG01", color: "#E2F2C5"},
      {code: "YG03", color: "#D2EB9D"}, {code: "YG05", color: "#B8E375"}, {code: "YG06", color: "#98D645"},
      {code: "YG07", color: "#7EC636"}, {code: "YG09", color: "#6BB82D"}, {code: "YG11", color: "#E2EED3"},
      {code: "YG13", color: "#CDE3AF"}, {code: "YG17", color: "#69B846"}, {code: "YG21", color: "#FAF6BE"},
      {code: "YG23", color: "#E9EA92"}, {code: "YG25", color: "#C1D747"}, {code: "YG41", color: "#CCEADA"},
      {code: "YG45", color: "#9EDAC5"}, {code: "YG61", color: "#C8DEC7"}, {code: "YG63", color: "#93C59A"},
      {code: "YG67", color: "#4F9B5E"}, {code: "YG91", color: "#DECFA5"}, {code: "YG93", color: "#C5B883"},
      {code: "YG95", color: "#9E904B"}, {code: "YG97", color: "#6D642D"}, {code: "YG99", color: "#45431E"},

      // YR Family
      {code: "YR0000", color: "#FFF4EC"}, {code: "YR000", color: "#FFE7D6"}, {code: "YR00", color: "#FED4B7"},
      {code: "YR01", color: "#FDC29C"}, {code: "YR02", color: "#FBB184"}, {code: "YR04", color: "#FF8D38"},
      {code: "YR07", color: "#F75C03"}, {code: "YR09", color: "#E34200"}, {code: "YR12", color: "#FDCB89"},
      {code: "YR14", color: "#FCA44D"}, {code: "YR15", color: "#FA9223"}, {code: "YR16", color: "#F78200"},
      {code: "YR18", color: "#E65200"}, {code: "YR20", color: "#FDE2C6"}, {code: "YR21", color: "#FBCB8B"},
      {code: "YR23", color: "#EDAA56"}, {code: "YR24", color: "#E39B35"}, {code: "YR27", color: "#B85C15"},
      {code: "YR30", color: "#FFF3DD"}, {code: "YR31", color: "#FBE2B2"}, {code: "YR61", color: "#FBC4AA"},
      {code: "YR65", color: "#FA8C4F"}, {code: "YR68", color: "#E85100"}
    ];

    let showColors = true;

    // Helper: Convert Hex to HSL
    function hexToHSL(hexColor) {
      if (!hexColor || typeof hexColor !== 'string') return {h: 0, s: 0, l: 0};
      const hex = hexColor.replace('#', '');
      if (hex.length < 6) return {h: 0, s: 0, l: 0};

      const r = parseInt(hex.substring(0, 2), 16) / 255;
      const g = parseInt(hex.substring(2, 4), 16) / 255;
      const b = parseInt(hex.substring(4, 6), 16) / 255;

      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h = 0, s = 0, l = (max + min) / 2;

      if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return {h: h * 360, s: s * 100, l: l * 100};
    }

    // Helper: Determine high contrast text color (Black/White)
    function getTextColor(hexColor) {
      if (!hexColor || typeof hexColor !== 'string') return '#111827';
      const hex = hexColor.replace('#', '');
      if (hex.length < 6) return '#111827';
      const r = parseInt(hex.substring(0, 2), 16) || 0;
      const g = parseInt(hex.substring(2, 4), 16) || 0;
      const b = parseInt(hex.substring(4, 6), 16) || 0;
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55 ? '#111827' : '#FFFFFF';
    }

    // Sorting functions
    function sortAlphanumeric(a, b) {
      const codeA = (a && a.code) ? String(a.code) : '';
      const codeB = (b && b.code) ? String(b.code) : '';
      return codeA.localeCompare(codeB, undefined, {numeric: true, sensitivity: 'base'});
    }

    function getSortedData(sortBy) {
      const dataCopy = Array.from(
        new Map(rawCopicData.filter(item => item && item.code).map(item => [item.code, item])).values()
      );

      switch (sortBy) {
        case 'hueLightness':
          return dataCopy.sort((colorA, colorB) => {
            // Convert both colors to the LCh color space (Lightness, Chroma, Hue)
            const [l1, c1, h1] = window.chroma(colorA.color).lch();
            const [l2, c2, h2] = window.chroma(colorB.color).lch();

            // 1. Handle achromatic colors (pure blacks, whites, grays)
            // If a color has almost no chroma (saturation), its hue is erratic.
            // We can push them to the beginning or end by checking lightness.
            const isAchromaticA = c1 < 5;
            const isAchromaticB = c2 < 5;

            if (isAchromaticA && !isAchromaticB) return -1; // Move grays to the front
            if (!isAchromaticA && isAchromaticB) return 1;
            if (isAchromaticA && isAchromaticB) return l1 - l2; // Sort grays by brightness

            // 2. Sort vibrant colors by Hue (0 to 360)
            // If hues are significantly different, sort by hue to get a rainbow effect
            if (Math.abs(h1 - h2) > 15) {
              return h1 - h2;
            }

            // 3. If they share a similar hue, sort by Lightness (perceived brightness)
            return l1 - l2;
          });
        case 'hue':
          return dataCopy.sort((a, b) => hexToHSL(a.color).h - hexToHSL(b.color).h);
        case 'saturation':
          return dataCopy.sort((a, b) => hexToHSL(b.color).s - hexToHSL(a.color).s);
        case 'lightness':
          return dataCopy.sort((a, b) => hexToHSL(b.color).l - hexToHSL(a.color).l);
        case 'code':
        default:
          return dataCopy.sort(sortAlphanumeric);
      }
    }



    // Toggle Color ON/OFF
    function toggleColors() {
      showColors = !showColors;
      const btnLabel = document.getElementById('toggle-color-label');
      if (showColors) {
        document.body.classList.remove('no-color');
        btnLabel.innerText = "Colors: ON";
      } else {
        document.body.classList.add('no-color');
        btnLabel.innerText = "Colors: OFF (Blank)";
      }
    }

    // Handle Sort Selector Change
    function handleSortChange() {
      const sortVal = document.getElementById('sort-select').value;
      const statusLabel = document.getElementById('sort-status-label');

      const names = {
        code: 'Color Label',
        hueLightness: 'Hue and Lightness',
        hue: 'Hue Spectrum',
        saturation: 'Saturation',
        lightness: 'Lightness'
      };

      if (statusLabel) {
        statusLabel.innerText = `Sorted By ${names[sortVal] || 'Color Label'} • 358 Swatches`;
      }

      renderGrid(getSortedData(sortVal));
    }

    // Render Modern CSS Hexagon Grid
    function renderGrid(data) {
      const container = document.getElementById('hex-container');
      if (!container) return;
      container.innerHTML = '';

      // Items per row calculation for staggering alternate lines
      const itemsPerRow = 19;

      data.forEach((item, idx) => {
        if (!item) return;
        const colorVal = item.color || '#CCCCCC';
        const textColor = getTextColor(colorVal);

        const cell = document.createElement('div');
        const isOffsetRow = Math.floor(idx / itemsPerRow) % 2 === 1 && (idx % itemsPerRow === 0);

        cell.className = `hex-cell ${isOffsetRow ? 'hex-row-shift' : ''}`;
        cell.style.backgroundColor = colorVal;
        cell.setAttribute('data-code', (item.code || '').toUpperCase());

        cell.innerHTML = `
          <span class="hex-code" style="color: ${textColor};">${item.code || ''}</span>
        `;

        container.appendChild(cell);
      });

      filterHexes();
    }

    // Live Search Filter
    function filterHexes() {
      const query = document.getElementById('search').value.trim().toUpperCase();
      const cells = document.querySelectorAll('.hex-cell');

      cells.forEach(cell => {
        const code = cell.getAttribute('data-code');
        if (!query || (code && code.includes(query))) {
          cell.style.opacity = '1';
          cell.style.transform = 'scale(1)';
        } else {
          cell.style.opacity = '0.12';
          cell.style.transform = 'scale(0.85)';
        }
      });
    }

    // Initialize Grid on Page Load
    window.onload = function () {
      renderGrid(getSortedData('code'));
    };
  </script>
